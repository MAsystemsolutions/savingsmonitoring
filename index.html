<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sun Fleet · Household Finances</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --ink: #181818;
      --muted: #66645e;
      --line: rgba(0,0,0,.12);
      --paper: #dedcd6; /* Elegant warm gray background */
      --white: #ffffff;
      --danger: #9e3030;
      --warning: #946c12;
      --success: #315e44;
      --shadow: 0 14px 40px rgba(0,0,0,.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "DM Sans", sans-serif; }
    button, input, select, textarea { font: inherit; cursor: pointer; }
    .app { min-height: 100vh; padding-bottom: 60px; }
    
    .nav { position: sticky; top: 0; z-index: 50; background: rgba(222,220,214,.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .nav-inner { max-width: 1400px; margin: auto; display: flex; justify-content: space-between; align-items: center; padding: 16px 30px; }
    .brand { font-family: "Playfair Display", serif; font-size: 21px; font-weight: 600; }
    
    .container { max-width: 1400px; margin: auto; padding: 30px; }
    .month-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .month-bar h2 { font-family: "Playfair Display", serif; font-size: 30px; margin: 0; }
    
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 30px; }
    .stat { background: var(--white); border: 1px solid var(--line); padding: 22px; border-radius: 12px; box-shadow: var(--shadow); }
    .stat-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; }
    .stat-value { font-family: "Playfair Display", serif; font-size: 26px; margin-top: 8px; }
    
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
    .panel { background: var(--white); border: 1px solid var(--line); padding: 26px; border-radius: 14px; box-shadow: var(--shadow); grid-column: span 6; }
    .panel.span-12 { grid-column: span 12; }
    .panel.span-4 { grid-column: span 4; }
    .panel.span-8 { grid-column: span 8; }
    
    .panel-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .panel-title h3 { font-family: "Playfair Display", serif; font-size: 21px; margin: 0; }
    
    .bill-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .bill-row.paid { background: #eef6f1; border-left: 4px solid var(--success); padding-left: 12px; border-radius: 6px; }
    .bill-row.urgent { border-left: 4px solid var(--danger); padding-left: 12px; background: #fdf6f6; border-radius: 6px; }
    .bill-info div:first-child { font-weight: 600; font-size: 14px; }
    .bill-info div:last-child { font-size: 11px; color: var(--muted); margin-top: 2px; }
    
    .badge { padding: 4px 10px; font-size: 10px; font-weight: 700; border-radius: 20px; text-transform: uppercase; letter-spacing: .05em; }
    .badge-unpaid { background: #e8e6e1; color: #555; }
    .badge-due { background: #fcf1dc; color: var(--warning); }
    .badge-overdue, .badge-critical { background: #faeaea; color: var(--danger); }
    .badge-paid { background: #e3efe7; color: var(--success); }

    .btn { background: #181818; color: white; border: 0; padding: 9px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; }
    .btn:hover { background: #333; }
    .btn-outline { background: var(--white); border: 1px solid var(--line); color: var(--ink); }
    
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal.open { display: flex; }
    .modal-card { width: 100%; max-width: 520px; background: var(--white); padding: 30px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); max-height: 90vh; overflow-y: auto; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field label { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .1em; font-weight: 600; }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid #d5d1c8; padding: 11px; border-radius: 8px; background: #faf9f5; outline: none; }
    
    .health-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 12px; }
    
    @media(max-width: 900px) { .panel { grid-column: span 12 !important; } }
  </style>
</head>
<body>

<div class="app">
  <nav class="nav">
    <div class="nav-inner">
      <div class="brand">Sun Fleet · Household Finances</div>
      <div>
        <button class="btn btn-outline" onclick="openIncomeModal()">Set Expected Salary</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="month-bar">
      <h2 id="monthTitle">Loading...</h2>
      <input type="month" id="monthPicker" onchange="loadDashboard()" style="padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--white);">
    </div>

    <!-- STATS -->
    <section class="stats">
      <div class="stat">
        <div class="stat-label">Expected Income</div>
        <div class="stat-value" id="expectedIncome">₱0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Fixed Bills Total</div>
        <div class="stat-value" id="fixedBillsTotal">₱0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Actual Spent</div>
        <div class="stat-value" id="actualExpenses">₱0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Allowed Expense Balance</div>
        <div class="stat-value" id="remainingBudget">₱0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Financial Health</div>
        <div style="margin-top:8px;"><span id="healthStatusBadge" class="health-badge badge-unpaid">Checking...</span></div>
      </div>
    </section>

    <!-- MAIN GRID -->
    <section class="grid">
      <!-- FIXED BILLS PANEL -->
      <div class="panel span-8">
        <div class="panel-title">
          <h3>Fixed Bills & Actuals</h3>
          <span class="text-muted" style="font-size:12px;" id="billCountSummary">0 bills</span>
        </div>
        <div id="billsContainer">Loading bills...</div>
      </div>

      <!-- SAVINGS & HEALTH CONTROLS -->
      <div class="panel span-4">
        <div class="panel-title">
          <h3>Savings & Goals</h3>
          <button class="btn btn-outline" onclick="openGoalModal()">+ Goal</button>
        </div>
        <div id="goalsContainer">No savings goals yet.</div>
      </div>
    </section>
  </main>
</div>

<!-- PAY BILL MODAL -->
<div class="modal" id="payModal">
  <div class="modal-card">
    <h3 style="margin-top:0; font-family:'Playfair Display'; font-size:24px;">Pay Bill: <span id="payBillName"></span></h3>
    <form onsubmit="submitBillPayment(event)">
      <input type="hidden" id="payBillId">
      <input type="hidden" id="payBillNameInput">
      <input type="hidden" id="payBillExpected">
      
      <div class="field">
        <label>Actual Amount Paid (₱)</label>
        <input type="number" step="0.01" id="payActualAmount" required>
      </div>
      <div class="field">
        <label>Payment Date</label>
        <input type="date" id="payDate" required>
      </div>
      <div class="field">
        <label>Payment Method</label>
        <select id="payMethod">
          <option>Online Bank</option>
          <option>GCash</option>
          <option>Cash</option>
          <option>Credit Card</option>
        </select>
      </div>
      <div class="field" style="background: #f0ede6; padding: 12px; border-radius: 8px; border: 1px dashed #b5ada0;">
        <label style="color: #181818; margin-bottom: 4px;">📎 Upload Screenshot / Receipt</label>
        <input type="file" id="payReceiptFile" accept="image/*,.pdf" style="background: white; border: 1px solid #d5d1c8;">
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="payNotes" rows="2"></textarea>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:24px;">
        <button type="button" class="btn btn-outline" onclick="closeModal('payModal')">Cancel</button>
        <button type="submit" class="btn">Confirm & Mark Paid</button>
      </div>
    </form>
  </div>
</div>

<!-- INCOME MODAL -->
<div class="modal" id="incomeModal">
  <div class="modal-card">
    <h3 style="margin-top:0; font-family:'Playfair Display'; font-size:24px;">Set Expected Monthly Fund</h3>
    <form onsubmit="submitExpectedIncome(event)">
      <div class="field">
        <label>Expected Income Amount (₱)</label>
        <input type="number" step="0.01" id="expectedIncomeInput" required>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:24px;">
        <button type="button" class="btn btn-outline" onclick="closeModal('incomeModal')">Cancel</button>
        <button type="submit" class="btn">Save Income</button>
      </div>
    </form>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxkbN2qwWHzdK2iK2RYbZLNIrf-KoMquD2TFf-3vos834sufp_o7w3h2cnwf6NK7FO16Q/exec";
  let DASHBOARD = {};

  document.addEventListener('DOMContentLoaded', () => {
    const now = new Date();
    document.getElementById('monthPicker').value = now.toISOString().substring(0, 7);
    loadDashboard();
  });

  async function apiCall(action, payload = {}) {
    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action, ...payload })
      });
      return await response.json();
    } catch (err) {
      console.error(err);
      alert('Error connecting to Google Sheet backend.');
    }
  }

  async function loadDashboard() {
    const month = document.getElementById('monthPicker').value;
    const data = await apiCall('getDashboardData', { monthStr: month });
    if (data) {
      DASHBOARD = data;
      renderDashboard();
    }
  }

  function renderDashboard() {
    const s = DASHBOARD.summary;
    document.getElementById('monthTitle').textContent = formatMonth(s.month);
    document.getElementById('expectedIncome').textContent = money(s.expectedIncome);
    document.getElementById('actualExpenses').textContent = money(s.actualExpenses);
    document.getElementById('remainingBudget').textContent = money(s.remainingAfterSavings);

    let fixedTotal = DASHBOARD.bills.reduce((sum, b) => sum + b.expectedAmount, 0);
    document.getElementById('fixedBillsTotal').textContent = money(fixedTotal);

    let badge = document.getElementById('healthStatusBadge');
    badge.textContent = s.healthStatus;
    badge.className = 'health-badge ' + (s.healthStatus.includes('Healthy') ? 'badge-paid' : (s.healthStatus.includes('Low') ? 'badge-due' : 'badge-critical'));

    renderBills();
    renderGoals();
  }

  function renderBills() {
    const container = document.getElementById('billsContainer');
    const bills = DASHBOARD.bills || [];
    document.getElementById('billCountSummary').textContent = `${bills.filter(b => b.status === 'PAID').length}/${bills.length} Paid`;

    if (!bills.length) {
      container.innerHTML = '<div style="color:var(--muted); font-size:12px;">No bills configured in RecurringBills tab.</div>';
      return;
    }

    container.innerHTML = bills.map(b => {
      let isPaid = b.status === 'PAID';
      let isUrgent = b.status === 'OVERDUE' || b.status === 'DUE SOON';
      let rowClass = isPaid ? 'bill-row paid' : (isUrgent ? 'bill-row urgent' : 'bill-row');
      
      let badgeClass = 'badge badge-unpaid';
      if (isPaid) badgeClass = 'badge badge-paid';
      else if (b.status === 'OVERDUE') badgeClass = 'badge badge-overdue';
      else if (b.status === 'DUE SOON') badgeClass = 'badge badge-due';

      return `
        <div class="${rowClass}">
          <div class="bill-info">
            <div>${escapeHtml(b.name)}</div>
            <div>Due: ${b.dueDate || 'N/A'} · Fixed: ${money(b.expectedAmount)}</div>
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <div style="text-align:right;">
              <div style="font-weight:600;">${b.actualAmount !== '' ? money(b.actualAmount) : '—'}</div>
              <span class="${badgeClass}">${b.status}</span>
            </div>
            ${!isPaid ? `<button class="btn" onclick="openPayModal('${b.id}', '${escapeHtml(b.name)}',${b.expectedAmount})">Pay</button>` : `<a href="${b.receiptUrl}" target="_blank" style="font-size:11px; color:var(--success); font-weight:600; text-decoration:none;" ${!b.receiptUrl ? 'style="display:none;"' : ''}>Receipt</a>`}
          </div>
        </div>
      `;
    }).join('');
  }

  function renderGoals() {
    const container = document.getElementById('goalsContainer');
    const goals = DASHBOARD.goals || [];
    if (!goals.length) {
      container.innerHTML = '<div style="color:var(--muted); font-size:12px;">No goals added yet.</div>';
      return;
    }
    container.innerHTML = goals.map(g => `
      <div style="margin-bottom:15px; padding-bottom:12px; border-bottom:1px solid var(--line);">
        <div style="font-weight:600; font-size:13px;">${escapeHtml(g.name)}</div>
        <div style="font-size:12px; color:var(--muted); margin-top:4px;">Target: ${money(g.target)}</div>
      </div>
    `).join('');
  }

  function openPayModal(id, name, expected) {
    document.getElementById('payBillId').value = id;
    document.getElementById('payBillName').textContent = name;
    document.getElementById('payBillNameInput').value = name;
    document.getElementById('payBillExpected').value = expected;
    document.getElementById('payActualAmount').value = expected;
    document.getElementById('payDate').value = new Date().toISOString().substring(0, 10);
    document.getElementById('payReceiptFile').value = '';
    document.getElementById('payModal').classList.add('open');
  }

  async function submitBillPayment(e) {
    e.preventDefault();
    const fileInput = document.getElementById('payReceiptFile');
    const file = fileInput.files[0];

    const payload = {
      billId: document.getElementById('payBillId').value,
      billName: document.getElementById('payBillNameInput').value,
      expectedAmount: document.getElementById('payBillExpected').value,
      actualAmount: document.getElementById('payActualAmount').value,
      paymentDate: document.getElementById('payDate').value,
      paymentMethod: document.getElementById('payMethod').value,
      notes: document.getElementById('payNotes').value
    };

    if (file) {
      const reader = new FileReader();
      reader.onload = async function(evt) {
        payload.receipt = { base64: evt.target.result, mimeType: file.type };
        await apiCall('saveBillPayment', payload);
        closeModal('payModal');
        loadDashboard();
      };
      reader.readAsDataURL(file);
    } else {
      await apiCall('saveBillPayment', payload);
      closeModal('payModal');
      loadDashboard();
    }
  }

  function openIncomeModal() {
    document.getElementById('incomeModal').classList.add('open');
  }

  async function submitExpectedIncome(e) {
    e.preventDefault();
    const val = document.getElementById('expectedIncomeInput').value;
    await apiCall('updateExpectedIncome', { amount: val });
    closeModal('incomeModal');
    loadDashboard();
  }

  async function openGoalModal() {
    let name = prompt('Enter Goal Name (e.g., Emergency Fund):');
    if (!name) return;
    let target = prompt('Enter Target Amount (₱):');
    if (!target) return;
    await apiCall('saveGoal', { name, targetAmount: target });
    loadDashboard();
  }

  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  function money(val) { return '₱' + Number(val || 0).toLocaleString('en-PH', { maximumFractionDigits: 2 }); }
  function formatMonth(val) { return new Date(val + '-01').toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); }
  function escapeHtml(str) { return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
</script>

</body>
</html>
